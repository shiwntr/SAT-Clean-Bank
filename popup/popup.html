<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="popup.css">
    </head>
    <body>
        <h1>SAT Clean Bank</h1>

        <div class="dropdown" id="font-dropdown" data-value="default"></div>

        <div id="countdown">
            <div class="counter days"></div>
            <p class="counter-text">:</p>
            <div class="counter hours"></div>
            <p class="counter-text">:</p>
            <div class="counter minutes"></div>
            <p class="counter-text">:</p>
            <div class="counter seconds"></div>
        </div>

        <div id="change-date">
            <p class="secondary-text" id="testing-day">1/1/26 at 12:00 AM</p>
            <button type="button" id="open-calendar">
                <svg class="calendar" width="25" height="25" viewBox="0 0 24 24" fill="none">
                    <path d="M3 9H21M7 3V5M17 3V5M6 12H8M11 12H13M16 12H18M6 15H8M11 15H13M16 15H18M6 18H8M11 18H13M16 18H18M6.2 21H17.8C18.9201 21 19.4802 21 19.908 20.782C20.2843 20.5903    20.5903 20.2843 20.782 19.908C21 19.4802 21 18.9201 21 17.8V8.2C21 7.07989 21 6.51984 20.782 6.09202C20.5903 5.71569 20.2843 5.40973 19.908 5.21799C19.4802 5 18.9201 5 17.8 5H6.2C5.0799 5 4.51984 5 4.09202 5.21799C3.71569 5.40973 3.40973 5.71569 3.21799 6.09202C3 6.51984 3 7.07989 3 8.2V17.8C3 18.9201 3 19.4802 3.21799 19.908C3.40973 20.2843 3.71569 20.5903 4.09202 20.782C4.51984 21 5.07989 21 6.2 21Z"
                    stroke="currentcolor" stroke-width="1" stroke-linecap="round"/>
                </svg>
            </button>
            <input type="datetime-local" id="calendar" hidden>
        </div>

        <p class="secondary-text">Stats coming soon...</p>

        <button type="button" id="qb-btn">Question Bank</button>

        <div id="data-buttons">
            <button type="button" class="text-button" id="export-data">Export Data</button>
            <button type="button" class="text-button" id="import-data">Import Data</button>
            <input type="file" id="import-file" accept=".json,application/json" hidden>
            <button type="button" class="text-button" id="reset-btn">Reset Data</button>
        </div>

        <script src="popup.js"></script>
    </body>
</html>
