        <div id="views">
            <div id="settings">
                <div class="dropdown" id="font-dropdown" data-value="default"></div>
                <div class="credits remove-margin">
                    <p class="credit-text remove-margin secondary-text"> Icons from <a target="_blank" href="https://icons8.com" class="link">Icons8</a> and <a target="_blank" href="https://www.svgrepo.com/" class="link">SVG Repo</a> </p>

            <div id="content">
                <div id="stats">
                    <div class="stat-counters">
                        <div class="counter-container">
                            <div class="counter questions-answered"></div>
                            <p class="counter-name questions-answered-counter-name">Answered</p>
                        </div>
                        <div class="seperator"></div>
                        <div class="counter-container">
                            <div class="first-attempt-container">
                                <div class="counter first-attempt"></div>
                                <p class="percent-sign">%</p>
                            </div>
                            <p class="counter-name questions-answered-counter-name">First Try</p>
                        </div>
                    </div>
                    <div class="bar question-stats"></div>
                </div>

                <div id="countdown">
                    <div class="counter days"></div>
                    <p class="countdown-colon">:</p>
                    <div class="counter hours"></div>
                    <p class="countdown-colon">:</p>
                    <div class="counter minutes"></div>
                    <p class="countdown-colon">:</p>
                    <div class="counter seconds"></div>
                </div>

                <div id="change-date">
                    <p class="secondary-text" id="testing-day">1/1/26 at 12:00 AM</p>
